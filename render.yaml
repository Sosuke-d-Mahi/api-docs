services:
  - type: web
    name: easir-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_VIEWER_TOKEN
        generateValue: true
